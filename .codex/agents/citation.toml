- 手順中の `$ARGUMENTS` は、親から渡されたタスク文と読み替える。親が解決済みのプロジェクト名を渡した場合は再解決しない。
- 正本 frontmatter の `tools:` が、この役割で使ってよいツールの範囲。範囲外のツールは使わない。
- 最終メッセージは、手順書の報告形式どおりの完全な報告にする（親はそれを再判断せずに統合する）。
